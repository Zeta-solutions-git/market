name: oe-market
services:
  ocean-market:
    # Our fork image (built from this repo). Roll back to
    # oceanenterprise/market:v1.5.0 to return to stock.
    image: zeta-market:catalogue-fix
    container_name: ocean-market
    ports:
      # Localhost only: nginx terminates TLS on 443 and proxies here.
      - '127.0.0.1:8008:8008'
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
